# Curvas del touchpad y del ratón estilo Windows (manjaro/touchpad-curve). Borra este archivo
# para volver al comportamiento normal de KDE tras cerrar sesión.
#
# Píxeles que avanza el cursor por cada mm de dedo, según la velocidad v (mm/s):
#   G(v) = gmin + (gmax - gmin) * (1 - exp(-v / tau))
# gmin: precisión al ir muy despacio (menos = más fino)
gmin = 4
# gmax: rapidez máxima al hacer movimientos largos y rápidos
gmax = 30
# tau: cuánto tarda en acelerar (más = acelera más tarde y más suave)
tau = 180
# Unidades por mm del touchpad (ABS_X del ASUP1415: 31)
resolution = 31
# Desplazamiento con dos dedos en px/mm (10,5 = igual que KDE por defecto)
scroll = 10.5
#
# --- Ratón (puntos del sensor; el botón de DPI del ratón sigue funcionando) ---
# Píxeles por punto según la velocidad v (puntos/ms):
#   M(v) = mouse_gmin + (mouse_gmax - mouse_gmin) * (1 - exp(-v / mouse_tau))
# Antes (libinput): 1 px/punto muy despacio y 2 px/punto casi siempre.
mouse_gmin = 0.5
mouse_gmax = 2.0
mouse_tau = 6
# Borra las tres líneas mouse_* para dejar el ratón como lo configura KDE.
#
# Para aplicar cambios: mueve un poco el control «Velocidad del puntero» del
# touchpad en Preferencias del sistema (KWin vuelve a configurar el touchpad).
